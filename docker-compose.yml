name: shortener

x-app-env: &app-env
  NODE_ENV: development
  LOG_LEVEL: info
  PUBLIC_BASE_URL: http://localhost:3000
  DATABASE_URL: postgres://shortener:shortener@postgres:5432/shortener
  DATABASE_SSL: "false"
  REDIS_URL: redis://valkey:6379
  KAFKA_BROKERS: kafka:19092
  KAFKA_SSL: "false"
  KAFKA_REPLICATION_FACTOR: "1"
  API_KEY: dev-api-key-change-me-0123456789

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT (19092) = dentro da rede do compose; PLAINTEXT_HOST (9092) = seu Mac
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # igual ao MSK: tópicos são criados pelo setup
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-ui:
    profiles: [tools]
    image: ghcr.io/kafbat/kafka-ui:latest   # fixe a versão atual depois do primeiro uso
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on: [kafka]

  setup:
    profiles: [app]
    build: .
    command: ["node", "dist/setup.js"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  api:
    profiles: [app]
    build: .
    ports: ["3000:3000"]
    environment: *app-env
    depends_on:
      setup: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }

  worker:
    profiles: [app]
    build: .
    command: ["node", "dist/worker.js"]
    environment: *app-env
    depends_on:
      setup: { condition: service_completed_successfully }

volumes:
  pgdata: {}
